<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible Connections</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    /* A small card for church websites: one verse, connection, journey step or prophecy. */
    :root {
      --bg: #ffffff; --text: #000000; --muted: rgba(60, 60, 67, 0.85); --link: #0058b0; --line: rgba(60, 60, 67, 0.29); --chip: #f2f2f7;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color-scheme: light;
    }
    :root[data-theme="dark"] { --bg: #1c1c1e; --text: #ffffff; --muted: rgba(235, 235, 245, 0.7); --link: #5eb0ff; --line: rgba(84, 84, 88, 0.6); --chip: #2c2c2e; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
    a { color: var(--link); text-underline-offset: 3px; }
    :focus-visible { outline: 3px solid var(--link); outline-offset: 2px; border-radius: 4px; }
    .card { padding: 16px 18px 14px; display: grid; gap: 8px; }
    .kicker { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
    h1 { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
    .refs { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 17px; font-weight: 600; }
    .refs .to { font-weight: 400; color: var(--muted); font-size: 15px; }
    .refs a { text-decoration: none; }
    .refs a:hover { text-decoration: underline; }
    ol.stages { margin: 0; padding-left: 1.3em; display: grid; gap: 2px; font-size: 15px; }
    ol.stages a { margin-left: 4px; text-decoration: none; }
    .note { margin: 0; font-size: 15px; color: var(--muted); }
    .q { margin: 0; font-size: 15px; font-style: italic; }
    .foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; border-top: 0.5px solid var(--line); padding-top: 10px; margin-top: 2px; font-size: 13px; color: var(--muted); }
    .brand { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 600; }
    .brand img { border-radius: 5px; }
    .open { font-weight: 600; text-decoration: none; min-height: 32px; display: inline-flex; align-items: center; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  </style>
  <script>
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <main class="card" id="card" aria-live="polite"><p class="kicker">Bible Connections</p></main>
  <script src="card.js"></script>
</body>
</html>
