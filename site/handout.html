<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journey handout · Bible Connections</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f4f8; color: #16161f; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .toolbar { display: flex; gap: 8px; justify-content: center; padding: 14px; flex-wrap: wrap; }
    .toolbar a, .toolbar button {
      min-height: 44px; padding: 8px 16px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
      border: 1px solid #0b5cad; background: #0b5cad; color: #fff; text-decoration: none; display: inline-flex; align-items: center;
    }
    .toolbar a { background: #fff; color: #0b5cad; }
    :focus-visible { outline: 3px solid #c2410c; outline-offset: 2px; }
    main { max-width: 800px; margin: 0 auto 40px; background: #fff; padding: 40px 48px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; font-size: 1.9rem; }
    .summary { color: #454556; margin: 0 0 24px; }
    ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
    ol.steps > li { counter-increment: s; border-top: 1px solid #d6d6e0; padding: 18px 0; break-inside: avoid; }
    ol.steps > li h2 { font-size: 1.2rem; margin: 0 0 4px; }
    ol.steps > li h2::before { content: counter(s) ". "; color: #0b5cad; }
    .refs { font-weight: 700; margin: 0 0 6px; }
    .q { font-style: italic; margin: 8px 0 0; }
    .lines { margin-top: 10px; height: 64px; background: repeating-linear-gradient(transparent 0 31px, #c9c9d6 31px 32px); }
    footer { margin-top: 24px; font-size: .8rem; color: #545468; border-top: 1px solid #d6d6e0; padding-top: 12px; }
    .error { text-align: center; padding: 40px; }
    @media (max-width: 640px) { main { padding: 24px 18px; border-radius: 0; } }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      main { box-shadow: none; padding: 0; max-width: none; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="Handout actions">
    <button type="button" id="printBtn">Print or save as PDF</button>
    <a href="./?view=journeys" id="backLink">Back to Bible Connections</a>
  </nav>
  <main id="handout"><p class="error">Loading…</p></main>
  <script src="handout.js"></script>
</body>
</html>
