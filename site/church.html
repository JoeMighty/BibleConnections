<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sermon series · Bible Connections</title>
  <meta name="description" content="This week's sermon passages, with links to read them and see how they connect across the Bible.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    /* A church's sermon series: this week's passage first, then every week. References and links only. */
    :root {
      --bg: #ffffff; --surface: #f2f2f7; --text: #000000; --muted: rgba(60, 60, 67, 0.85); --link: #0058b0; --accent: #0071e3; --accent-ink: #fff; --line: rgba(60, 60, 67, 0.29);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color-scheme: light;
    }
    :root[data-theme="dark"] { --bg: #000000; --surface: #1c1c1e; --text: #ffffff; --muted: rgba(235, 235, 245, 0.7); --link: #5eb0ff; --accent: #0a84ff; --line: rgba(84, 84, 88, 0.6); color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 400 17px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
    a { color: var(--link); text-underline-offset: 3px; }
    :focus-visible { outline: 3px solid var(--link); outline-offset: 2px; border-radius: 4px; }
    main { max-width: 720px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
    body.embed main { padding-top: 16px; }
    .kicker { margin: 0 0 4px; font-size: 15px; font-weight: 600; color: var(--muted); }
    h1 { margin: 0 0 18px; font: 700 clamp(26px, 5vw, 36px)/1.12 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
    .now { background: var(--surface); border-radius: 16px; padding: 18px 20px; margin: 0 0 22px; display: grid; gap: 8px; }
    .now .label { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--link); }
    .now h2 { margin: 0; font: 700 22px/1.2 var(--font-display); }
    .now .ref { margin: 0; font-size: 19px; font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; font-size: 15px; }
    .btn.ghost { background: transparent; color: var(--link); box-shadow: inset 0 0 0 1px var(--line); }
    h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    ol.weeks { list-style: none; margin: 0; padding: 0; border-top: 0.5px solid var(--line); }
    ol.weeks li { display: grid; grid-template-columns: 6.5em 1fr; gap: 2px 14px; padding: 12px 0; border-bottom: 0.5px solid var(--line); }
    ol.weeks .date { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
    ol.weeks .title { font-weight: 600; }
    ol.weeks .links { grid-column: 2; font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
    ol.weeks li.past .title { color: var(--muted); font-weight: 500; }
    ol.weeks li.current .date { color: var(--link); font-weight: 600; }
    footer { margin-top: 18px; font-size: 13px; color: var(--muted); }
    footer a { color: var(--muted); }
    .error { color: var(--muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    @media (max-width: 420px) { ol.weeks li { grid-template-columns: 1fr; } ol.weeks .links { grid-column: 1; } }
    @media print { .actions { display: none; } .now { background: none; border: 1px solid #ccc; } a { color: inherit; } }
  </style>
  <script>
    (function () {
      var p = new URLSearchParams(location.search), t = p.get('theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      if (p.get('embed') === '1') document.documentElement.classList.add('embed-page');
    })();
  </script>
</head>
<body>
  <main id="main"><p class="kicker">Bible Connections</p></main>
  <script src="i18n.js" data-url-only></script>
  <script src="church.js"></script>
</body>
</html>
