name: Content suggestion
description: Suggest a note, journey, theme or translation fix
labels: [content]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What would you like to suggest?
      options: ["A new or better note", "A new journey", "A new theme", "A discussion question", "A Spanish translation fix", "Other"]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Include references (for example John 3:16). Please write in your own words and do not copy text from copyrighted Bible translations.
    validations:
      required: true
